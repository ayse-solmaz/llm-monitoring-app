global:
  # 5s was too aggressive on a shared-CPU demo host (cadvisor + MLC compete).
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI KPI gateway — TTFT, tokens/sec, inflight, E2E latency (pull model).
  - job_name: mlc-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  # Container-level CPU / memory / network (MLC itself has no /metrics).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
