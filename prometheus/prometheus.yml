global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # FastAPI KPI gateway — TTFT, tokens/sec, inflight, E2E latency (pull model).
  - job_name: mlc-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  # Container-level CPU / memory / network (MLC itself has no /metrics).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
