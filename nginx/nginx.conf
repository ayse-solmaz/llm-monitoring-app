# MLC load-balancer config
#
# least_conn vs round-robin:
# LLM requests have wildly different durations (short prompts finish in seconds,
# long CPU generations can take minutes). round-robin ignores in-flight load and
# can pile concurrent long jobs onto the same replica. least_conn sends each new
# request to the replica with the fewest active connections, keeping replicas
# balanced under skewed latency.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — required for dynamic resolution when mlc is scaled.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Custom format: upstream_addr proves which replica handled each request.
    log_format lb_proof '$remote_addr - [$time_local] '
                        '"$request" $status '
                        'upstream=$upstream_addr '
                        'request_time=$request_time';

    upstream mlc_backend {
        zone mlc_backend 64k;
        # least_conn: prefer replica with fewest active connections (see note above).
        least_conn;
        # Single line — Docker DNS resolves mlc to all scaled replica IPs.
        server mlc:8000 resolve;
    }

    server {
        listen 80;

        access_log /var/log/nginx/access.log lb_proof;

        # Browser (localhost:3000 / Vercel) → MLC needs CORS.
        set $cors_origin "";
        if ($http_origin ~* ^(https?://localhost:3000|https://llm-monitoring-app\.vercel\.app)$) {
            set $cors_origin $http_origin;
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://mlc_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # Long CPU generations need generous timeouts.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Disable buffering so streaming tokens pass through immediately.
            proxy_buffering off;
        }
    }
}
