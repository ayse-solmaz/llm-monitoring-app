# Scalable MLC layer — uses pre-built mlc-server-spike (do NOT rebuild here).
# Public entry: mlc-gateway:8080 (KPI metrics) → nginx → mlc×N
# Scale: docker compose up -d --scale mlc=3
#
# Model weights live on named volume `mlc-model` (shared RO by all replicas).
# model-init copies once from the image into the volume on first boot.

services:
  # One-shot: seed shared volume from image /app/model (skip if already seeded).
  model-init:
    image: mlc-server-spike:latest
    pull_policy: never
    volumes:
      - mlc-model:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/gemma-cpu.so ]; then
          echo "mlc-model volume already seeded — skip copy"
          ls -lah /data | head -20
          exit 0
        fi
        echo "Seeding mlc-model volume from image /app/model ..."
        cp -a /app/model/. /data/
        ls -lah /data | head -20
        echo "Seed complete."
    restart: "no"

  mlc:
    # Local-only image (built via mlc-server/Dockerfile). Never pull from Docker Hub.
    # Command pinned to gemma-cpu.so on the shared volume — do not rely on image CMD
    # (a partial rebuild once pointed at missing qwen-cpu.so).
    image: mlc-server-spike:latest
    pull_policy: never
    command:
      [
        "python3",
        "-m",
        "mlc_llm",
        "serve",
        "/app/model",
        "--model-lib",
        "/app/model/gemma-cpu.so",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--device",
        "cpu",
        # Tek kullanicili demo: max_batch=1, bellek penceresi modele ayrilir.
        "--mode",
        "interactive",
      ]
    # Thread sayisi CPU kotasiyla AYNI olmali. Onceki 8 thread / 4 CPU
    # ayari cgroup throttle uretiyordu (nr_throttled > 0, throttled_usec ~170s).
    # Host 8 cekirdek; 6 modele, 2 izleme/OS'e.
    environment:
      TVM_NUM_THREADS: "6"
      OMP_NUM_THREADS: "6"
    shm_size: "2gb"
    expose:
      - "8000"
    volumes:
      # Same weights for every replica — do not duplicate GB per container.
      - mlc-model:/app/model:ro
      # PEFT/LoRA adapters (FINAL BOSS) — drop folders under ./peft-adapters
      - ./peft-adapters:/adapters:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 6G
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:alpine
    # No host port — only reachable from mlc-gateway on the compose network.
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mlc

  # FastAPI KPI gateway: streams via nginx→MLC, exposes /metrics for Prometheus.
  gateway:
    build: ./mlc-gateway
    ports:
      - "8080:8080"
    environment:
      MLC_UPSTREAM: http://nginx:80
      MLC_TIMEOUT_SECONDS: "1200"
      MAX_INFLIGHT: "1"
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - gateway
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mlc-model:
